<?xml version="1.0" encoding="UTF-8"?>
<!-- Desktop monitor frame canônico — neutral matte black
     Inspirado em nexu-io/open-design (Apache-2.0). 16:9 screen aspect. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" fill="none">
  <!-- Bezel -->
  <rect x="20" y="20" width="920" height="540" rx="12" ry="12"
        fill="#0F172A" stroke="#000000" stroke-width="2"/>
  <!-- Screen 16:9 (888x500 inside) -->
  <rect x="36" y="36" width="888" height="500" fill="#F3F4F6"/>
  <!-- Brand chin -->
  <rect x="430" y="544" width="100" height="10" rx="3" fill="#374151"/>
  <!-- Stand -->
  <path d="M 410 560 L 550 560 L 580 605 L 380 605 Z" fill="#1F2937"/>
  <rect x="320" y="605" width="320" height="10" rx="4" fill="#111827"/>
</svg>
