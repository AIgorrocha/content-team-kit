<?xml version="1.0" encoding="UTF-8"?>
<!-- MacBook Pro frame canônico — neutral silver
     Inspirado em nexu-io/open-design (Apache-2.0). 16:10 screen aspect. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" fill="none">
  <!-- Screen body -->
  <rect x="60" y="20" width="780" height="490" rx="14" ry="14"
        fill="#1F2937" stroke="#0F172A" stroke-width="2"/>
  <rect x="76" y="36" width="748" height="458" rx="4" ry="4" fill="#000000"/>
  <rect x="80" y="40" width="740" height="450" fill="#F3F4F6"/>
  <!-- Notch / camera -->
  <circle cx="450" cy="30" r="3" fill="#0F172A"/>
  <!-- Hinge -->
  <rect x="55" y="510" width="790" height="6" rx="3" fill="#374151"/>
  <!-- Base -->
  <path d="M 30 516 L 870 516 L 850 560 L 50 560 Z" fill="#9CA3AF"/>
  <rect x="380" y="516" width="140" height="6" rx="2" fill="#6B7280"/>
</svg>
