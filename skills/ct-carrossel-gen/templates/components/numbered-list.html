<!-- Component: numbered-list (01/02/03 + título + subtítulo)
     Open Design pattern: número grande em accent + texto + small muted.
     Uso típico: slide "5 mudanças que…" ou "passo a passo". -->
<style>
.list           { display: flex; flex-direction: column; gap: 18px;
                  margin-top: var(--space-xs); align-items: flex-start;
                  width: 100%; max-width: 900px; }
.item           { display: flex; align-items: flex-start; gap: var(--space-md);
                  width: 100%; text-align: left; }
.num            { font-size: 32px; font-weight: 900; color: var(--accent);
                  letter-spacing: -1px; min-width: 54px; line-height: 1.05; }
.txt            { font-size: var(--text-md); font-weight: 600;
                  color: var(--text-primary); line-height: 1.3; padding-top: 4px; }
.txt strong     { color: var(--accent); font-weight: 800; }
.txt small      { font-size: 20px; font-weight: 400; color: var(--text-muted);
                  display: block; margin-top: 6px; line-height: 1.4; }
</style>

<div class="list">
  <div class="item"><div class="num">01</div><div class="txt">Título do item<small>Subtítulo explicativo curto</small></div></div>
  <div class="item"><div class="num">02</div><div class="txt">Título do item<small>Subtítulo explicativo curto</small></div></div>
  <div class="item"><div class="num">03</div><div class="txt">Título do item<small>Subtítulo explicativo curto</small></div></div>
</div>
