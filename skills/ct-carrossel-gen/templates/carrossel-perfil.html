<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  {{FONT_IMPORT}}
  {{TOKENS}}

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: var(--canvas-w);
    height: var(--canvas-h);
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text-primary);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: var(--car-header-pad-top) var(--car-header-pad-x) 0 var(--car-header-pad-x);
    flex-shrink: 0;
  }

  .avatar {
    width: var(--car-avatar-size);
    height: var(--car-avatar-size);
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .header-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .header-name {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .check-selo {
    display: inline-flex;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }

  .header-handle {
    font-size: 26px;
    font-weight: 400;
    color: var(--text-meta);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 var(--car-content-pad-x);
  }

  /* HOOK SLIDE - slide 1 */
  .hook-text {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.3;
    color: var(--text-primary);
    letter-spacing: -1px;
  }

  .hook-sub {
    font-size: 38px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-secondary);
    margin-top: 36px;
  }

  .hook-thread {
    font-size: 34px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-meta);
    margin-top: 44px;
  }

  /* BODY SLIDE - slides 2-N */
  .slide-title {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.25;
    color: var(--text-primary);
    margin-bottom: 36px;
    letter-spacing: -0.5px;
  }

  .slide-body {
    font-size: 34px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  .slide-body p {
    margin-bottom: 22px;
  }

  .slide-body .bullet {
    padding-left: 8px;
    margin-bottom: 18px;
    font-size: 32px;
    line-height: 1.5;
  }

  .slide-body .bullet::before {
    content: "\2022  ";
    color: var(--text-primary);
    font-weight: 700;
    font-size: 32px;
  }

  .slide-body .emphasis {
    color: var(--text-primary);
    font-weight: 600;
  }

  .slide-body .highlight {
    color: var(--accent);
    font-weight: 700;
  }

  .slide-body .closing {
    margin-top: 36px;
    color: var(--car-closing);
    font-style: italic;
    font-size: 30px;
  }

  /* CTA SLIDE */
  .cta-text {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.3;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .cta-action {
    font-size: 40px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-top: 44px;
    line-height: 1.5;
  }

  .cta-handle {
    font-size: 30px;
    font-weight: 500;
    color: var(--text-meta);
    margin-top: 52px;
  }

  /* QUOTE BLOCK */
  .quote {
    background: var(--surface);
    border-left: 4px solid var(--car-quote-border);
    padding: 24px 28px;
    margin: 24px 0;
    border-radius: 0 8px 8px 0;
    font-size: 30px;
    line-height: 1.55;
    color: var(--car-quote-text);
    font-style: italic;
  }

  /* FOOTER */
  .footer {
    padding: 0 var(--car-header-pad-x) 48px var(--car-header-pad-x);
    flex-shrink: 0;
  }

  .footer-line {
    font-size: 22px;
    font-weight: 500;
    color: var(--car-faint);
  }
</style>
</head>
<body>
  <div class="header">
    {{AVATAR}}
    <div class="header-text">
      <div class="header-name">{{BRAND_NAME}}{{BADGE}}</div>
      {{HANDLE}}
    </div>
  </div>
  <div class="content" id="slide-content">
    {{CONTENT}}
  </div>
</body>
</html>
